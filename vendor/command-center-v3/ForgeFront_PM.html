  <div id="toast" class="toast"></div>
  <script src="./demo-portfolio-seed.js"></script>
  <script>
(() => {
  const STORAGE_KEY = 'forgefront-pm-v1';
  const V3_VERSION = '3.0';
  const CLIENT_ID = localStorage.getItem('forgefront-pm-client-id') || uidSeed();
  localStorage.setItem('forgefront-pm-client-id',CLIENT_ID);
  function uidSeed(){return `client_${Math.random().toString(36).slice(2,9)}_${Date.now().toString(36)}`;}
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const uid = p => `${p}_${Math.random().toString(36).slice(2,9)}_${Date.now().toString(36)}`;
  const today = () => new Date().toISOString().slice(0,10);
  const money = n => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n||0));
  const pct = n => `${Math.round(Number(n||0))}%`;
  const esc = v => String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const fmtDate = d => d ? new Date(`${d}T12:00:00`).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) : '-';
  const daysFromNow = d => d ? Math.ceil((new Date(`${d}T12:00:00`) - new Date())/86400000) : 9999;
  const statusClass = s => String(s||'neutral').toLowerCase().replace(/[^a-z0-9]+/g,'-');
  const badge = s => `<span class="status ${statusClass(s)}">${esc(s||'Neutral')}</span>`;


  // Competition portfolio: Meta AI build timeline + synthetic aerospace demos.
  // Source of truth: ./demo-portfolio-seed.js (window.FFR_DEMO_PORTFOLIO).
  // Never re-embed private org registries here.
  const DEMO = (typeof window !== 'undefined' && window.FFR_DEMO_PORTFOLIO) || { version: 0, projects: [], tasks: [], actions: [], raid: [], approvals: [] };
  const FORGEFRONT_ORG_SEED_VERSION = Number(DEMO.version || 11);

  const seed = () => ({
    settings: Object.assign({ company: 'ForgeFront Systems', currency: 'USD' }, DEMO.settings || {}),
    projects: [],
    tasks: [],
    approvals: [],
    production: [],
    logistics: [],
    budgets: [],
    raid: [],
    changes: [],
    actions: [],
    onsite: [],
    calendar: [],
    pubs: [],
    accessTokens: [],
    contacts: [],
    meetings: [],
    stakeholders: [],
    solarLeads: [],
    solarCalls: [],
    solarDnc: [],
    solarConfig: {}
  });

  let state = load();

  const GENERIC_SEEDED_CODE = /^(CORE|AGENT|APP|EDU|ODIN|TRADE|SEC|INFRA|CREATIVE|BRAND|EVID|BIZ)[ -]\d+$/i;
  function bootstrapForgeFrontPortfolio() {
    state.meta = state.meta || {};
    if (Number(state.meta.orgPortfolioSeedVersion || 0) >= FORGEFRONT_ORG_SEED_VERSION) return;
    if (!Array.isArray(DEMO.projects) || !DEMO.projects.length) return;
    // Wipe prior private/org/synthetic seeds so v11 Meta timeline is the only portfolio.
    state.projects = [];
    state.actions = [];
    state.tasks = [];
    state.raid = [];
    state.approvals = [];
    DEMO.projects.forEach(x => state.projects.push({ ...x }));
    (DEMO.tasks || []).forEach(x => state.tasks.push({ ...x }));
    (DEMO.actions || []).forEach(x => state.actions.push({ ...x }));
    (DEMO.raid || []).forEach(x => state.raid.push({ ...x }));
    (DEMO.approvals || []).forEach(x => state.approvals.push({ ...x }));
    if (DEMO.settings) state.settings = Object.assign({}, state.settings || {}, DEMO.settings);
    state.meta.orgPortfolioSeedVersion = FORGEFRONT_ORG_SEED_VERSION;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
  }

  let currentView = 'control';
  let currentProject = 'all';
  let navigationHistory = [];
  let modalContext = null;

  const SAFE_STATE_ID=/^[A-Za-z0-9_.:-]{1,120}$/;
  function assertSafeStateIds(candidate){
    const forbidden=new Set(['__proto__','prototype','constructor']);
    const walk=(value,key='')=>{
      if(Array.isArray(value)){
        if(key==='projectIds') value.forEach(v=>{if(v&&!SAFE_STATE_ID.test(String(v)))throw new Error('Unsafe project ID in workspace data')});
        else value.forEach(v=>walk(v,''));
        return;
      }
      if(!value||typeof value!=='object') return;
      for(const [k,v] of Object.entries(value)){
        if(forbidden.has(k)) throw new Error('Unsafe object key in workspace data');
        if((k==='id'||/Id$/.test(k))&&v!==''&&v!=null&&!SAFE_STATE_ID.test(String(v))) throw new Error(`Unsafe identifier in workspace data: ${k}`);
        walk(v,k);
      }
    };
    walk(candidate);
    return candidate;
  }
  function load(){
    try{ const x=localStorage.getItem(STORAGE_KEY); return x?JSON.parse(x):seed(); }catch{return seed();}
  }
  function reset(){ if(confirm('Reset ForgeFront Systems PM to an empty workspace? This replaces local data.')){state=seed();save();render();toast('Workspace reset');} }
  function toast(msg){ const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800); }
  function project(id){return state.projects.find(p=>p.id===id)}
  function scoped(arr){return currentProject==='all'?arr:arr.filter(x=>x.projectId===currentProject)}
  function projectOptions(sel){return state.projects.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.name)} - ${esc(p.client)}</option>`).join('')}

  function locationState(){return {view:currentView,project:currentProject};}
  function sameLocation(a,b){return a.view===b.view&&a.project===b.project;}
  function navigate(view=currentView,projectId=currentProject,record=true){
    const next={view:view||currentView,project:projectId===undefined?currentProject:projectId};
    const here=locationState();
    if(record&&!sameLocation(here,next)) navigationHistory.push(here);
    currentView=next.view; currentProject=next.project;
    $('#sidebar').classList.remove('open');
    render();
  }
  function goBack(){
    if(navigationHistory.length){
      const prev=navigationHistory.pop(); currentView=prev.view; currentProject=prev.project; render(); return;
    }
    if(currentView!=='control'||currentProject!=='all'){currentView='control';currentProject='all';render();return;}
    toast('You are at the starting screen');
  }
  function updateBackButton(){
    const b=$('#backBtn'); if(!b)return;
    const atStart=currentView==='control'&&currentProject==='all'&&navigationHistory.length===0;
    b.disabled=atStart;
    b.title=atStart?'Starting screen':'Go back to the previous screen';
  }

  const navGroups = [
    ['COMMAND', [['control','','Control Room'],['dashboard','','Portfolio']]],
    ['COLLABORATION', [['communications','','Comms Hub'],['meetings','','Meeting Rooms'],['stakeholders','','Stakeholder Hub']]],
    ['PROJECT DELIVERY', [['overview','','Project Overview'],['schedule','','Plan & Schedule'],['approvals','','Design & Approvals'],['production','','Build & Production'],['logistics','','Logistics']]],
    ['PROJECT CONTROL', [['budget','','Commercial'],['risks','','Risks & Changes'],['actions','','Actions & Decisions']]],
    ['FIELD & LEADERSHIP', [['onsite','','On-site Command'],['calendar','','Delivery Calendar'],['reports','','Reports & KPIs'],['publish','','Publish & Export']]],
    ['SYSTEM', [['integrations','','Integrations'],['templates','','Setup']]]
  ];

  function buildNav(){
    $('#nav').innerHTML=navGroups.map(([group,items])=>`<div class="nav-section">${group}</div>${items.map(([id,ico,label])=>`<button class="nav-btn ${currentView===id?'active':''}" data-view="${id}"><span class="ico">${ico}</span>${label}</button>`).join('')}`).join('');
    $$('#nav .nav-btn').forEach(b=>b.onclick=()=>navigate(b.dataset.view,currentProject));
  }
  function buildProjectFilter(){
    $('#projectFilter').innerHTML=`<option value="all">All Projects / Portfolio</option>${projectOptions(currentProject)}`;
    $('#projectFilter').value=currentProject;
    $('#projectFilter').onchange=e=>navigate(currentView,e.target.value);
  }
  function setHeader(title,eyebrow='FORGEFRONT SYSTEMS'){$('#pageTitle').textContent=title;$('#pageEyebrow').textContent=eyebrow;}
  function render(){buildNav();buildProjectFilter();updateBackButton();const f=views[currentView]||views.dashboard;f();}


  const PHASES=['Initiation & Kickoff','Concept & Design','Technical Planning & Approval','Production & Logistics','Installation & Live Event','Teardown & Wrap-up'];
  function selectedProject(){return currentProject==='all'?null:project(currentProject)}
  function derivedHealth(p){
    const tasks=state.tasks.filter(x=>x.projectId===p.id), approvals=state.approvals.filter(x=>x.projectId===p.id), raids=state.raid.filter(x=>x.projectId===p.id), logs=state.logistics.filter(x=>x.projectId===p.id);
    const criticalIssue=raids.some(x=>x.status!=='Closed'&&x.severity==='Critical');
    const criticalLate=tasks.some(x=>x.status!=='Complete'&&x.critical&&daysFromNow(x.due)<0);
    const blockLate=approvals.some(x=>x.status==='Pending'&&x.blocks&&daysFromNow(x.due)<0);
    const red=criticalIssue||criticalLate||blockLate;
    const amber=raids.some(x=>x.status!=='Closed'&&x.severity==='High')||logs.some(x=>['At Risk','Blocked'].includes(x.status))||(+p.forecast||0)>(+p.budget||0)*1.05||approvals.some(x=>x.status==='Pending'&&x.blocks&&daysFromNow(x.due)<=3);
    return red?'Red':amber?'Amber':'Green';
  }
  function gateFor(p){
    const phaseIndex=Math.max(0,PHASES.indexOf(p.phase));
    const apps=state.approvals.filter(x=>x.projectId===p.id), prod=state.production.filter(x=>x.projectId===p.id), logs=state.logistics.filter(x=>x.projectId===p.id), site=state.onsite.filter(x=>x.projectId===p.id), issues=state.raid.filter(x=>x.projectId===p.id&&x.kind==='Issue'&&x.status!=='Closed');
    let name='Project Closeout', blockers=[];
    if(phaseIndex<=0){name='Concept Direction'; blockers=apps.filter(x=>['Concept Design','Client'].includes(x.type)&&x.status==='Pending').map(x=>`Pending approval: ${x.item}`)}
    else if(phaseIndex===1){name='Design Freeze'; blockers=apps.filter(x=>['Concept Design','Graphics','Client'].includes(x.type)&&x.status!=='Approved'&&x.blocks).map(x=>`Approval: ${x.item}`)}
    else if(phaseIndex===2){name='Fabrication Release'; blockers=apps.filter(x=>['Technical','Venue','Fabrication Release'].includes(x.type)&&x.status!=='Approved'&&x.blocks).map(x=>`Approval: ${x.item}`)}
    else if(phaseIndex===3){name='Dispatch Readiness'; blockers=[...prod.filter(x=>x.status!=='Complete'||x.qc==='Fail'||!x.ready).slice(0,4).map(x=>`Production: ${x.package}`),...logs.filter(x=>['At Risk','Blocked'].includes(x.status)).slice(0,3).map(x=>`Logistics: ${x.leg}`)]}
    else if(phaseIndex===4){name='Client Handover'; blockers=[...site.filter(x=>x.critical&&x.status!=='Complete').slice(0,5).map(x=>`Site: ${x.item}`),...issues.filter(x=>['Critical','High'].includes(x.severity)).slice(0,3).map(x=>`Issue: ${x.title}`)]}
    else {blockers=issues.map(x=>`Open issue: ${x.title}`).slice(0,4)}
    return {name,blockers,status:blockers.length?'Blocked':'Ready'};
  }
  function requireProjectContext(title,eyebrow='PROJECT CONTROL'){
    if(currentProject!=='all')return false;
    setHeader(title,eyebrow);
    $('#content').innerHTML=`<div class="card context-required"><h2>Select a project first</h2><p>${esc(title)} changes operational records. Portfolio context is too broad for this screen, so the Command Center will not silently choose a project for you.</p><div class="project-chooser">${state.projects.map(p=>`<button class="primary" data-choose-project="${p.id}">${esc(p.name)} - ${esc(p.client)}</button>`).join('')}</div></div>`;
    $$('[data-choose-project]').forEach(b=>b.onclick=()=>navigate(currentView,b.dataset.chooseProject));
    return true;
  }
  function jump(view,pid){navigate(view,pid===undefined?currentProject:pid)}
  window.forgefrontAndroidBack=()=>{if(navigationHistory.length){goBack();return true;}if(currentView!=='control'||currentProject!=='all'){navigate('control','all');return true;}return false;};
  function contextBanner(p){return `<div class="project-context-banner"><div><strong>${esc(p.name)}</strong><br><span>${esc(p.client)}  ·  ${esc(p.event)}  ·  ${esc(p.city)}</span></div>${badge(derivedHealth(p))}</div>`}

  function controlRoom(){
    setHeader('Control Room','WHAT REQUIRES ACTION NOW');
    const scopeProjects=currentProject==='all'?state.projects:state.projects.filter(p=>p.id===currentProject); const ids=new Set(scopeProjects.map(p=>p.id));
    const items=[]; const add=(rank,color,title,meta,view,pid,due='')=>items.push({rank,color,title,meta,view,pid,due});
    state.raid.filter(x=>ids.has(x.projectId)&&x.status!=='Closed'&&x.kind==='Issue'&&['Critical','High'].includes(x.severity)).forEach(x=>add(x.severity==='Critical'?1:2,x.severity==='Critical'?'red':'amber',x.title,`${project(x.projectId)?.name||''}  ·  ISSUE  ·  ${x.owner}  ·  due ${fmtDate(x.due)}`,'risks',x.projectId,x.due));
    state.approvals.filter(x=>ids.has(x.projectId)&&x.status==='Pending'&&x.blocks).forEach(x=>add(daysFromNow(x.due)<0?2:3,daysFromNow(x.due)<0?'red':'amber',`Blocking approval: ${x.item}`,`${project(x.projectId)?.name||''}  ·  ${x.approver}  ·  due ${fmtDate(x.due)}`,'approvals',x.projectId,x.due));
    state.tasks.filter(x=>ids.has(x.projectId)&&x.status!=='Complete'&&x.critical&&daysFromNow(x.due)<0).forEach(x=>add(2,'red',`Critical path overdue: ${x.name}`,`${project(x.projectId)?.name||''}  ·  ${x.owner}  ·  due ${fmtDate(x.due)}`,'schedule',x.projectId,x.due));
    state.logistics.filter(x=>ids.has(x.projectId)&&['At Risk','Blocked'].includes(x.status)).forEach(x=>add(3,x.status==='Blocked'?'red':'amber',`Logistics exception: ${x.leg}`,`${project(x.projectId)?.name||''}  ·  ${x.carrier}  ·  delivery ${fmtDate(x.delivery)}`,'logistics',x.projectId,x.delivery));
    state.raid.filter(x=>ids.has(x.projectId)&&x.status!=='Closed'&&x.kind!=='Issue'&&['Critical','High'].includes(x.severity)).forEach(x=>add(x.severity==='Critical'?3:4,x.severity==='Critical'?'red':'amber',`${x.kind}: ${x.title}`,`${project(x.projectId)?.name||''}  ·  ${x.owner}  ·  due ${fmtDate(x.due)}`,'risks',x.projectId,x.due));
    scopeProjects.filter(p=>(+p.forecast||0)>(+p.budget||0)*1.05).forEach(p=>add(4,'amber',`Forecast above baseline: ${p.name}`,`${p.code}  ·  variance ${money((+p.forecast||0)-(+p.budget||0))}`,'budget',p.id,p.showOpen));
    state.actions.filter(x=>ids.has(x.projectId)&&x.status!=='Complete'&&daysFromNow(x.due)<0).forEach(x=>add(5,'amber',`Overdue ${x.kind.toLowerCase()}: ${x.title}`,`${project(x.projectId)?.name||''}  ·  ${x.owner}  ·  due ${fmtDate(x.due)}`,'actions',x.projectId,x.due));
    items.sort((a,b)=>a.rank-b.rank||(a.due||'9999').localeCompare(b.due||'9999'));
    const top=items.slice(0,12); const nextShows=[...scopeProjects].sort((a,b)=>(a.health===b.health?Number(a.progress||0)-Number(b.progress||0):(a.health==='Red'?-1:b.health==='Red'?1:a.health==='Amber'?-1:1))).slice(0,4);
    $('#content').innerHTML=`<div class="grid kpi-grid">${kpi('Immediate Exceptions',items.filter(x=>x.rank<=2).length,'Critical / overdue')}${kpi('Blocking Approvals',state.approvals.filter(x=>ids.has(x.projectId)&&x.status==='Pending'&&x.blocks).length,'Stops downstream work')}${kpi('Critical Path Overdue',state.tasks.filter(x=>ids.has(x.projectId)&&x.status!=='Complete'&&x.critical&&daysFromNow(x.due)<0).length,'Schedule intervention')}${kpi('Logistics Exceptions',state.logistics.filter(x=>ids.has(x.projectId)&&['At Risk','Blocked'].includes(x.status)).length,'Freight / access')}${kpi('Open Decisions',state.actions.filter(x=>ids.has(x.projectId)&&x.kind==='Decision'&&x.status!=='Complete').length,'Authority required')}${kpi('Projects at Risk',scopeProjects.filter(p=>derivedHealth(p)!=='Green').length,'Derived control health')}</div><div class="spacer-lg"></div><div class="grid two-col">${card('Priority Queue','Sorted by operational consequence, not by module',`<div class="priority-list">${top.length?top.map(x=>`<div class="priority-item"><div class="priority-bar ${x.color}"></div><div><div class="priority-title">${esc(x.title)}</div><div class="priority-meta">${esc(x.meta)}</div></div><div class="priority-actions"><button class="ghost" data-jump="${x.view}" data-project="${x.pid}">Open</button></div></div>`).join(''):'<div class="muted small">No priority exceptions in the current scope.</div>'}</div>`)}${card('Priority Projects','Fast entry into the project workspace',`<div class="alert-list">${nextShows.map(p=>{const g=gateFor(p);return `<div class="alert-item"><div style="display:flex;justify-content:space-between;gap:8px"><div class="alert-title">${esc(p.name)}</div>${badge(derivedHealth(p))}</div><div class="alert-meta">${esc(p.client)}  ·  ${esc(p.city)}  ·  ${p.progress}%  ·  Next: ${esc(p.nextMilestone||g.name)}</div><div style="margin-top:8px"><button class="ghost" data-jump="overview" data-project="${p.id}">Open project</button></div></div>`}).join('')}</div>`)}</div>`;
    $('#content').insertAdjacentHTML('afterbegin',`<div class="command-shortcuts" style="margin-bottom:14px"><button class="shortcut" data-v3jump="communications">Comms Hub</button><button class="shortcut" data-v3jump="meetings">Meeting Room</button><button class="shortcut" data-v3jump="stakeholders">Stakeholders</button><button class="shortcut" data-v3jump="publish">Publish Update</button></div>`);
    $$('[data-v3jump]').forEach(b=>b.onclick=()=>jump(b.dataset.v3jump,currentProject));
    $$('[data-jump]').forEach(b=>b.onclick=()=>jump(b.dataset.jump,b.dataset.project));
  }

  function projectOverview(){
    if(requireProjectContext('Project Overview','PROJECT WORKSPACE'))return; const p=selectedProject(), g=gateFor(p), phaseIndex=Math.max(0,PHASES.indexOf(p.phase));
    const tasks=state.tasks.filter(x=>x.projectId===p.id), raids=state.raid.filter(x=>x.projectId===p.id&&x.status!=='Closed'), apps=state.approvals.filter(x=>x.projectId===p.id&&x.status==='Pending'), actions=state.actions.filter(x=>x.projectId===p.id&&x.status!=='Complete').sort((a,b)=>a.due.localeCompare(b.due));
    const overdue=tasks.filter(x=>x.status!=='Complete'&&daysFromNow(x.due)<0); const variance=(+p.forecast||0)-(+p.budget||0); const days=p.showOpen?daysFromNow(p.showOpen):null;
    setHeader(p.name,'PROJECT WORKSPACE');
    const ribbon=`<div class="phase-ribbon">${PHASES.map((ph,i)=>`<div class="phase-step ${i<phaseIndex?'done':i===phaseIndex?'current':''}"><div class="num">PHASE ${i+1}</div><div class="name">${esc(ph)}</div></div>`).join('')}</div>`;
    const gate=`<div class="gate"><div class="gate-top"><div><div class="eyebrow">NEXT CONTROL GATE</div><h3>${esc(g.name)}</h3></div>${badge(g.status)}</div>${g.blockers.length?`<ul>${g.blockers.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<div class="small muted" style="margin-top:9px">No blocking conditions detected from current records.</div>'}</div>`;
    $('#content').innerHTML=`${contextBanner(p)}${card('Current Authority','Hostile-audited source of truth, refreshed from the 2026-10-07 authority ledger',`<div class="alert-list"><div class="alert-item"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><div class="eyebrow">AUTHORITY STATUS</div><div class="alert-title">${esc(p.authorityVerdict||p.city||'Unknown')}</div></div>${badge(p.authorityHealth||'Amber')}</div><div class="alert-meta" style="margin-top:8px"><strong>Verified:</strong> ${esc(p.authorityVerified||'Not recorded')}</div><div class="alert-meta" style="margin-top:6px"><strong>Current authority:</strong> ${esc(p.authoritySource||p.venue||'Not recorded')}</div><div class="alert-meta" style="margin-top:6px"><strong>Correction / rule:</strong> ${esc(p.authorityCorrection||'Use current authority only')}</div></div></div>`)}<div class="spacer"></div>${card('Lifecycle','Where this project is in the ForgeFront delivery flow',ribbon)}<div class="spacer"></div><div class="grid kpi-grid">${kpi('Target Date',p.showOpen?(days<0?`${Math.abs(days)}d ago`:`${days}d`):'Not set',p.showOpen?fmtDate(p.showOpen):'Set when scheduled')}${kpi('Derived Health',derivedHealth(p),'From live controls')}${kpi('Schedule Progress',pct(p.progress),'PM-entered progress')}${kpi('Overdue Tasks',overdue.length,'Open past due')}${kpi('Pending Approvals',apps.length,'Client / technical gates')}${kpi('Forecast Variance',money(variance),variance>0?'Above baseline':'Within baseline')}</div><div class="spacer-lg"></div><div class="grid two-col">${gate}${card('Next Commitments','The next work that needs ownership',`<div class="alert-list">${actions.slice(0,6).map(x=>`<div class="alert-item"><div style="display:flex;justify-content:space-between;gap:8px"><div class="alert-title">${esc(x.title)}</div>${badge(x.status)}</div><div class="alert-meta">${esc(x.owner)}  ·  due ${fmtDate(x.due)}  ·  ${esc(x.authority||'')}</div></div>`).join('')||'<div class="muted small">No open commitments.</div>'}</div>`)}</div><div class="spacer-lg"></div>${card('Project Control Surfaces','Move directly to the record set you need',`<div class="overview-actions"><button class="jump-chip" data-jump="schedule">Plan & Schedule</button><button class="jump-chip" data-jump="approvals">Design & Approvals</button><button class="jump-chip" data-jump="production">Build & Production</button><button class="jump-chip" data-jump="logistics">Logistics</button><button class="jump-chip" data-jump="budget">Commercial</button><button class="jump-chip" data-jump="risks">Risks & Changes</button><button class="jump-chip" data-jump="actions">Actions & Decisions</button><button class="jump-chip" data-jump="onsite">On-site Command</button></div>`)}`;
    $$('[data-jump]').forEach(b=>b.onclick=()=>jump(b.dataset.jump,p.id));
  }

  const kpi = (label,value,sub='')=>`<div class="card kpi"><div class="label">${esc(label)}</div><div class="value">${value}</div><div class="sub">${esc(sub)}</div></div>`;
  const card = (title,subtitle,body,actions='')=>`<div class="card card-pad"><div class="section-head"><div><h2>${esc(title)}</h2>${subtitle?`<p>${esc(subtitle)}</p>`:''}</div><div class="section-actions">${actions}</div></div>${body}</div>`;

  function dashboard(){
    setHeader('Portfolio','PORTFOLIO CONTROL');
    const projects=currentProject==='all'?state.projects:state.projects.filter(p=>p.id===currentProject);
    if(!projects.length){
      $('#content').innerHTML=`<div class="card card-pad empty-portfolio"><div class="empty-mark">FF</div><div><div class="eyebrow">FORGEFRONT PROGRAM MANAGEMENT</div><h2>Create your first project</h2><p>Start a project workspace to unlock schedule, approvals, production, logistics, budget, RAID, actions, field command, and reporting.</p><button class="primary" id="emptyCreateProject">+ New Project</button></div></div>`;
      $('#emptyCreateProject').onclick=()=>openModal('projects');
      return;
    }
    const tasks=scoped(state.tasks); const risks=scoped(state.raid).filter(r=>r.status!=='Closed'); const approvals=scoped(state.approvals).filter(a=>a.status==='Pending');
    const budget=projects.reduce((s,p)=>s+Number(p.budget||0),0); const forecast=projects.reduce((s,p)=>s+Number(p.forecast||0),0);

  // ===== SOLAR SALES V1: Nancy + Jeff behavioral engine =====
  function solarLead(id){return state.solarLeads.find(x=>x.id===id)}
  function solarNormPhone(v){return String(v||'').replace(/\D/g,'').slice(-10)}
  function solarNormEmail(v){return String(v||'').trim().toLowerCase()}
  function solarNormAddress(v){return String(v||'').trim().toLowerCase().replace(/\s+/g,' ')}
  function isSolarLeadDnc(lead){
    if(!lead)return false;
    if(lead.status==='Do Not Contact')return true;
    const phone=solarNormPhone(lead.phone),alt=solarNormPhone(lead.alternatePhone),email=solarNormEmail(lead.email),address=solarNormAddress(lead.address);
    return (state.solarDnc||[]).some(x=>(phone&&phone===x.phone)||(alt&&alt===x.phone)||(email&&email===x.email)||(address&&address===x.address));
  }
  function recordSolarDnc(lead,call){
    const rec={id:uid('dnc'),leadId:lead.id||'',name:lead.name||'',phone:solarNormPhone(lead.phone)||solarNormPhone(lead.alternatePhone),email:solarNormEmail(lead.email),address:solarNormAddress(lead.address),time:nowIso(),callId:call?.id||'',reason:'Prospect requested no further contact'};
    const exists=(state.solarDnc||[]).some(x=>(rec.phone&&x.phone===rec.phone)||(rec.email&&x.email===rec.email)||(rec.address&&x.address===rec.address));
    if(!exists)state.solarDnc.unshift(rec);
  }
  function solarLatestCall(leadId){return [...state.solarCalls].filter(x=>x.leadId===leadId).sort((a,b)=>String(b.updatedAt||b.startedAt||'').localeCompare(String(a.updatedAt||a.startedAt||'')))[0]||null}
  function solarActiveCall(leadId){return [...state.solarCalls].filter(x=>x.leadId===leadId&&!['COMPLETE','TERMINATED'].includes(x.stage)).sort((a,b)=>String(b.updatedAt||b.startedAt||'').localeCompare(String(a.updatedAt||a.startedAt||'')))[0]||null}
  function solarActiveLead(){const id=state.solarConfig?.activeLeadId;return solarLead(id)||state.solarLeads[0]||null}
  function solarEventLabel(event){return String(event||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase())}
  function solarLeadStatus(lead,call){if(lead?.status)return lead.status;if(call?.stage==='COMPLETE')return 'Appointment Ready';if(call?.stage==='TERMINATED')return 'Do Not Contact';if(call)return 'In Call';return 'New'}
  function solarFormValue(id){const el=document.getElementById(id);if(!el)return'';if(el.type==='checkbox')return !!el.checked;if(el.type==='number')return Number(el.value||0);return el.value||''}
  function solarSnapshotPayload(){return {
    name:solarFormValue('solarName'),phone:solarFormValue('solarPhone'),alternatePhone:solarFormValue('solarAltPhone'),email:solarFormValue('solarEmail'),address:solarFormValue('solarAddress'),street:solarFormValue('solarStreet'),utility:solarFormValue('solarUtility'),highestBill:solarFormValue('solarHighestBill'),averageBill:solarFormValue('solarAverageBill'),sunExposure:solarFormValue('solarSun'),shadeNotes:solarFormValue('solarShade'),futureLoad:solarFormValue('solarFutureLoad'),roofAgeYears:solarFormValue('solarRoofAge'),roofInstaller:solarFormValue('solarRoofInstaller'),roofConcern:solarFormValue('solarRoofConcern'),decisionMakers:solarFormValue('solarDecisionMakers'),priorSolarExperience:solarFormValue('solarPriorSolar'),householdConcern:solarFormValue('solarHouseholdConcern'),localWorkVerified:solarFormValue('solarLocalWorkVerified'),notes:solarFormValue('solarNotes'),appointmentType:solarFormValue('solarApptType'),appointmentDate:solarFormValue('solarApptDate'),appointmentTime:solarFormValue('solarApptTime'),assignedCloser:solarFormValue('solarCloser'),assignedVerifier:solarFormValue('solarVerifier')
  }}
  function saveSolarConfig(){state.solarConfig.repName=solarFormValue('solarRepName');state.solarConfig.repId=solarFormValue('solarRepId');state.solarConfig.companyIdentity=solarFormValue('solarCompanyIdentity');state.solarConfig.companyIdentityApproved=solarFormValue('solarIdentityApproved');save();render();toast('Solar settings saved')}
  function saveSolarLeadSnapshot(leadId){const lead=solarLead(leadId);if(!lead)return;Object.assign(lead,solarSnapshotPayload(),{updatedAt:nowIso()});if(!lead.createdAt)lead.createdAt=nowIso();save();render();toast('Lead updated')}
  function startSolarCall(leadId){
    const lead=solarLead(leadId);if(!lead)return;
    if(isSolarLeadDnc(lead)){toast('Do Not Contact - call start blocked');return;}
    if(!state.solarConfig.repName||!state.solarConfig.repId||!state.solarConfig.companyIdentity||state.solarConfig.companyIdentityApproved!==true){toast('Complete and approve caller identity before starting');return;}
    state.solarConfig.activeLeadId=leadId;
    let call=solarActiveCall(leadId);
    if(!call){call=SolarCallEngine.createSession({id:uid('sc'),leadId,repName:state.solarConfig.repName||'',repId:state.solarConfig.repId||''});state.solarCalls.unshift(call);lead.status='In Call';lead.updatedAt=nowIso();logActivity('call',`Solar call started for ${lead.name||lead.address||'lead'}`,'',state.solarConfig.repName||'You');}
    save();render();
  }
  function applySolarEvent(event,payload={}){
    const lead=solarActiveLead();if(!lead)return;
    let call=solarActiveCall(lead.id);if(!call){call=SolarCallEngine.createSession({id:uid('sc'),leadId:lead.id,repName:state.solarConfig.repName||''});state.solarCalls.unshift(call);}
    const snapshot=solarSnapshotPayload();
    let eventPayload=Object.assign({},payload||{});
    if(event==='qualification_update')eventPayload=snapshot;
    if(['roof_old','roof_warranty','research_trust','decision_maker','bill_unavailable','moving_transfer','term_duration','payment_structure','household_succession','general_resistance'].includes(event))eventPayload=Object.assign({},snapshot,eventPayload);
    if(event==='appointment_booked')eventPayload=Object.assign({},snapshot,{appointmentType:snapshot.appointmentType,appointmentDate:snapshot.appointmentDate,appointmentTime:snapshot.appointmentTime,email:snapshot.email,phone:snapshot.phone});
    if(event==='bill_received')eventPayload={billReceived:true};
    const next=SolarCallEngine.applyEvent(call,event,eventPayload);
    const idx=state.solarCalls.findIndex(x=>x.id===call.id);state.solarCalls[idx]=next;
    const last=next.history?.[next.history.length-1];
    Object.assign(lead,snapshot,{updatedAt:nowIso()});
    if(last?.type==='invalid_transition'||last?.type==='invalid_event'){save();render();toast('Action blocked - invalid call transition');return;}
    if(event==='roof_old')lead.roofConcern=lead.roofConcern||'Older roof / replacement horizon';
    if(event==='roof_warranty')lead.roofConcern=lead.roofConcern||'Existing roof warranty concern';
    if(event==='appointment_booked')lead.status='Appointment Booked';
    if(event==='bill_received')lead.billReceived=true;
    if(event==='bill_requested')lead.status='Bill Requested';
    if(event==='verification_complete'){lead.verificationStatus='Complete';lead.status='Appointment Ready';}
    if(event==='do_not_contact'){lead.status='Do Not Contact';recordSolarDnc(lead,next);}
    logActivity('call',`Solar: ${solarEventLabel(event)} - ${lead.name||lead.address||'lead'}`,'',state.solarConfig.repName||'You');
    save();render();
  }

  function fieldHTML([key,label,type,opts],value){
    const v=Array.isArray(value)?value.join(', '):(value??'');let input='';
    if(type==='select') input=`<select name="${key}">${opts.map(o=>`<option ${String(v)===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(type==='project') input=`<select name="${key}">${projectOptions(v|| (currentProject!=='all'?currentProject:state.projects[0]?.id))}</select>`;
    else if(type==='textarea') input=`<textarea name="${key}">${esc(v)}</textarea>`;
    else if(type==='checkbox') input=`<input name="${key}" type="checkbox" ${v?'checked':''}>`;
    else input=`<input name="${key}" type="${type}" value="${esc(v)}" ${type==='number'?'step="any"':''}>`;
    return `<div class="field ${type==='textarea'?'full':''}"><label>${esc(label)}</label>${input}</div>`;
  }
  function openModal(key,id=null){
    const schema=schemas[key];if(!schema)return;const rec=id?state[key].find(x=>x.id===id):{};modalContext={key,id};$('#modalEyebrow').textContent=key.toUpperCase();$('#modalTitle').textContent=`${id?'Edit':'Add'} ${key.replace(/s$/,'')}`;$('#modalBody').innerHTML=`<div class="form-grid">${schema.map(f=>fieldHTML(f,rec?.[f[0]])).join('')}</div>`;$('#modal').showModal();
  }
  function submitModal(e){e.preventDefault();const {key,id}=modalContext||{};if(!key)return;const schema=schemas[key],fd=new FormData(e.currentTarget),obj=id?state[key].find(x=>x.id===id):{id:uid(key.slice(0,2))};schema.forEach(([k,,type])=>{if(type==='checkbox')obj[k]=e.currentTarget.elements[k].checked;else if(type==='number')obj[k]=Number(fd.get(k)||0);else obj[k]=fd.get(k)||'';});if(Object.prototype.hasOwnProperty.call(obj,'projectIds')&&typeof obj.projectIds==='string')obj.projectIds=obj.projectIds.split(',').map(x=>x.trim()).filter(Boolean);if(key==='solarLeads'){obj.updatedAt=nowIso();obj.createdAt=obj.createdAt||obj.updatedAt;obj.status=obj.status||'New';}if(!id)state[key].push(obj);if(key==='solarLeads'&&!state.solarConfig.activeLeadId)state.solarConfig.activeLeadId=obj.id;logActivity('record',`${id?'Updated':'Added'} ${key.replace(/s$/,'')}`,obj.projectId||((obj.projectIds||[])[0])||'');save();$('#modal').close();toast(id?'Record updated':'Record added');render();}
