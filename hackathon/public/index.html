<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ForgeFront Factory Resilience</title>
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/ui/theme.css">
  <script>
    window.__errs = [];
    window.addEventListener('error', function (event) {
      window.__errs.push(String(event.message || event.error || 'Unknown error'));
    });
    window.addEventListener('unhandledrejection', function (event) {
      window.__errs.push(String(event.reason || 'Unhandled rejection'));
    });
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/ui/kit.mjs"></script>
</body>
</html>
